
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title></title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

video {
    position: fixed;
    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    object-fit: contain;
    background: black;

    border: none;
    outline: none;
}
</style>
</head>

<body>

<video
    id="video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
>
    <source src="/video.mp4" type="video/mp4">
</video>
<script>
const video = document.getElementById("video");

video.muted = true;
video.play().catch(error => {
    console.log("Trinh duyet dang chan autoplay:", error);
});
</script>

</body>
</html>
